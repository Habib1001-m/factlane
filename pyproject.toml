[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factlane"
version = "0.1.6"
description = "Local-first, multi-host governed memory plane for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp-memory-service==11.10.0",
  "mcp==1.30.0",
  "pydantic==2.13.5",
  "sqlite-vec==0.1.9",
  "tokenizers==0.23.1",
  "typing-extensions==4.16.0",
]

[project.urls]
Repository = "https://github.com/Habib1001-m/factlane"
Documentation = "https://github.com/Habib1001-m/factlane/blob/main/docs/QUICKSTART.md"
Security = "https://github.com/Habib1001-m/factlane/blob/main/SECURITY.md"

[dependency-groups]
dev = ["pytest==9.0.3"]

[project.scripts]
factlane = "factlane.server:main"
factlane-migrate-storage-v3 = "factlane.storage_migration:main"
factlane-owner = "factlane.owner_cli:main"
factlane-owner-webui = "factlane.owner_webui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factlane = ["data/embedding_compatibility/*.json"]

[tool.setuptools.data-files]
"share/factlane/skills/using-factlane" = ["skills/using-factlane/SKILL.md"]
"share/factlane/skills/using-factlane/references" = ["skills/using-factlane/references/host-bootstrap.md"]

[tool.uv]
package = true
