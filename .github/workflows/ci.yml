name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: uv run python -c "import factlane; print(factlane.__name__)"
      - run: uv run factlane --help
      - name: Classify package release surface
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        run: >-
          uv run python scripts/check_release_surface.py
          --expected-classification DEVELOPMENT_QUALIFICATION_ONLY
          --snapshot site/publication/released-contract-v0.1.3.json
          --receipt "${{ runner.temp }}/factlane-release-surface.json"
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Qualify public site artifact
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          FACTLANE_SITE_URL: https://factlane.pages.dev
          FACTLANE_PUBLIC_BUILD: "1"
          FACTLANE_PUBLICATION_CI_OUTPUT: ${{ github.workspace }}/site/.publication-ci
          FACTLANE_PROTECTED_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash site/scripts/qualify-publication-ci.sh
      - name: Record publication qualification
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          {
            echo '### FactLane public-site qualification'
            echo '```text'
            cat site/.publication-ci/QUALIFICATION.env
            echo '```'
            echo 'This artifact is qualification evidence only; CI never deploys Production.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload qualified publication package
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: factlane-site-publication-${{ github.event.pull_request.head.sha || github.sha }}
          path: site/.publication-ci/
          if-no-files-found: error
          retention-days: 14

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - run: uv sync --frozen --dev
      - name: Verify native Windows x64 runtime prerequisites
        shell: pwsh
        run: |
          uv run python -c "import os, platform, sqlite3, sys; assert sys.platform == 'win32' and os.name == 'nt'; assert platform.machine().lower() in {'amd64', 'x86_64'}; assert sqlite3.sqlite_version_info >= (3, 42, 0); print(sys.version); print(platform.platform()); print(sqlite3.sqlite_version)"
          uv run python -c "import factlane, factlane.server, factlane.storage, factlane.recovery; print(factlane.__name__)"
          uv run factlane --help
          uv run factlane --help-tools
      - name: Qualify native Windows standard runtime
        run: uv run pytest -q
