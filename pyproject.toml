[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factlane"
version = "0.1.2"
description = "Local-first, multi-host governed memory plane for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp-memory-service @ git+https://github.com/doobidoo/mcp-memory-service.git@e5155b937051db4fa99a384018c5ebd621d8c5ef",
  "mcp==1.29.1",
  "pydantic==2.13.5",
  "sqlite-vec==0.1.9",
  "tokenizers==0.23.1",
  "typing-extensions==4.16.0",
]

[project.urls]
Repository = "https://github.com/Habib1001-m/factlane"
Documentation = "https://github.com/Habib1001-m/factlane/blob/main/docs/QUICKSTART.md"
Security = "https://github.com/Habib1001-m/factlane/blob/main/SECURITY.md"

[dependency-groups]
dev = ["pytest==9.0.3"]

[project.scripts]
factlane = "factlane.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/factlane/skills/using-factlane" = ["skills/using-factlane/SKILL.md"]

[tool.uv]
package = true
